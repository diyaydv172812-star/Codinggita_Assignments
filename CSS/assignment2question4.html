<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .team {
  display: flex;
  flex-flow: row wrap;
  width: 100%;
  gap: 20px;
  justify-content: space-between;
  align-items: center;
}

.member {
  flex: 1 0 280px;
  min-width: 0;
  padding: 20px;
  border: 1px solid #999;
  background: #f5f5f5;
  box-sizing: border-box;
}

.member:nth-child(3) {
  order: 3;
}

.member:nth-child(1) {
  order: 2;
}

.member:nth-child(2) {
  order: 1;
}

.member:nth-child(4) {
  order: 4;
}
    </style>
</head>
<body>
<section class="team">
  <article class="member">
    <h3>Rahul</h3>
    <p>Frontend Developer</p>
  </article>

  <article class="member">
    <h3>Priya</h3>
    <p>Backend Developer</p>
  </article>

  <article class="member">
    <h3>Aman</h3>
    <p>Team Leader</p>
  </article>

  <article class="member">
    <h3>Neha</h3>
    <p>UI/UX Designer</p>
  </article>
</section>
</body>
</html>
