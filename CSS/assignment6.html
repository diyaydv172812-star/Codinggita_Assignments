<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .main{
            height: 100vh;
            width: 100vw;
            background-image: url(bg.svg);
            background-repeat: no-repeat;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .sub{
            height: 50%;
            width: 50%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 50px;
            margin-right: 12%;
        }
        .first{
            height: 80%;
            width: 80%;
            background-color: rgb(73, 73, 217);
            border-radius: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        .second{
            height: 80%;
            width: 80%;
            background-color: rgb(41, 181, 41);
            border-radius: 10%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: flex-start;
        }
        h6{
            font-weight: bolder;
            font-size: 80px;
            color: white;
            margin: 0;
        }
        .num{
            margin-top: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5px;
        }
        .num div{
            height: 30px;
            width: 30px;
            border-radius: 50%;
            background-color: white;
            color: black;
            font-size: 20px;
            font-weight: bolder;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        h4{
            font-size: 40px;
            color: white;
        }
        .end{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
            margin-top: 20px;
            width: 100%;
        }
        .end1{
            height: 50px;
            width: 50px;
            border: 1px solid white;
            background-color: yellow;
            border-radius: 20%;
        }
        .end2{
            height: 50px;
            width: 50px;
            border: 1px solid white;
            background-color: red;
            border-radius: 20%;
        }

    </style>
</head>
<body>
    <div class="main">
        <div class="sub">
            <div class="first">
                <h6>IND</h6>
                <div class="num">
                    <div>4</div>
                    <div>3</div>
                    <div>2</div>
                    <div>6</div>
                    <div>6</div>
                    <div>6</div>
                </div>
                <h4>24/0</h4>
            </div>
            <div class="second">
                <h6>PAK</h6>
                <div class="num">
                    <div>2</div>
                    <div>4</div>
                    <div>0</div>
                    <div>3</div>
                    <div>1</div>
                    <div>4</div>
                </div>
                <h4>14/0</h4>
            </div>
        </div>
        <div class="end">
            <div class="end1">

            </div>
            <div class="end2">

            </div>
        </div>
    </div>
</body>
</html>
